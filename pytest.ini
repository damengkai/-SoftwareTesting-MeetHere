[pytest]
testpaths =
    pytest_tests
    api_auto_framework/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra
markers =
    p0: highest-priority core business checks
    p1: high-priority important business checks
    p2: medium-priority checks
    p3: low-priority checks
    smoke: quick checks for core pages and public APIs
    auth: login and session tests
    venue: venue module tests
    news: news module tests
    message: message module tests
    order: order module tests
    admin: admin module tests
    destructive: tests that create, update, delete, or approve data
    requires_login: tests that require an authenticated session
